name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run C unit tests
        run: sh tests/run_tests.sh

      - name: Run LoRa airtime calculator self-test
        run: python3 tools/lora_airtime.py --selftest
